name: Generate Web Report

on:
  schedule:
    - cron: '0 * * * *'   # main page: mỗi tiếng (UTC) — tiếng chẵn +7 VN
    - cron: '0 2 * * *'   # product page: 09:00 Vietnam = 02:00 UTC
  workflow_dispatch:        # cho phép chạy thủ công để test

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate main dashboard (mỗi tiếng)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          PANCAKE_ACCESS_TOKEN: ${{ secrets.PANCAKE_ACCESS_TOKEN }}
          META_API_VERSION: 'v25.0'
          REPORT_TIMEZONE: 'Asia/Ho_Chi_Minh'
        run: python -m work_report_bot generate-html --output docs/index.html

      - name: Generate product report (09:00 VN hoặc manual)
        if: >
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '0 2 * * *'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          PANCAKE_ACCESS_TOKEN: ${{ secrets.PANCAKE_ACCESS_TOKEN }}
          META_API_VERSION: 'v25.0'
          REPORT_TIMEZONE: 'Asia/Ho_Chi_Minh'
        run: python -m work_report_bot generate-product-html --output docs/san-pham.html

      - name: Commit và push HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/san-pham.html
          git diff --cached --quiet || git commit -m "chore: update dashboard [skip ci]"
          git push
