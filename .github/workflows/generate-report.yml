name: Generate Web Report

on:
  schedule:
    - cron: '0 * * * *'   # mỗi tiếng (UTC) — tương đương tiếng chẵn +7 giờ VN
  workflow_dispatch:        # cho phép chạy thủ công để test

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate HTML dashboard
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          PANCAKE_ACCESS_TOKEN: ${{ secrets.PANCAKE_ACCESS_TOKEN }}
          META_API_VERSION: 'v25.0'
          REPORT_TIMEZONE: 'Asia/Ho_Chi_Minh'
        run: python -m work_report_bot generate-html --output docs/index.html

      - name: Commit và push HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: update web dashboard [skip ci]"
          git push
