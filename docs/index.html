<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="60">
  <title>Báo cáo Ads/POS — Antigravity</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; background: #f5f6fa; color: #555; }
    .box { text-align: center; }
    h1 { font-size: 20px; color: #2c3e50; margin-bottom: 10px; }
    p  { font-size: 14px; }
    .spinner { width: 36px; height: 36px; border: 4px solid #ddd;
               border-top-color: #3498db; border-radius: 50%;
               animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>📊 Báo cáo Ads/POS — Antigravity</h1>
    <p>Đang chờ lần cập nhật đầu tiên từ GitHub Actions…</p>
    <p style="margin-top:8px;font-size:12px;color:#aaa">Trang sẽ tự reload sau 60 giây</p>
  </div>
</body>
</html>
